<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#211728"><title>Mes Petits Trésors</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f1e7ef;background:#211728}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#46304d,#211728 55%);min-height:100vh}.wrap{max-width:850px;margin:auto;padding:20px 15px 70px}header{text-align:center;padding:18px 0}h1{font-family:Georgia,serif;font-size:2rem;margin:7px 0;color:#f5dff1}h2{font-family:Georgia,serif;color:#eac9e6;font-size:1.3rem}small,.muted{color:#c9b4ca}.eyebrow{letter-spacing:3px;color:#b7ff69;font-size:11px}nav{display:flex;gap:5px;overflow:auto;padding:5px 0 15px}button{cursor:pointer;border:1px solid #755e7b;background:#392b43;color:#f9eaf5;border-radius:12px;padding:11px 13px;font-weight:650}button.active,button.primary{background:#a4fb51;color:#1c2920;border-color:#baff77}button:disabled{opacity:.45}nav button{white-space:nowrap;flex:1}.panel{background:#302339;border:1px solid #614c68;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 6px 20px #160d1b55}.total{font-size:2.2rem;font-weight:800;color:#b9ff73}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stats .panel{margin:0}.stat{font-size:1.35rem;font-weight:750;color:#e8d5ec}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.card{background:#35273f;border:1px solid #65536e;border-radius:17px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px}.card h3{text-align:center;margin:2px 0;font-family:Georgia,serif;font-size:1.04rem}.card p{margin:0;font-size:13px;color:#d4bed8}.flask{width:120px;height:160px;filter:drop-shadow(0 0 8px #77fa3544)}.card button{width:100%}.actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}.actions button{font-size:12px;padding:8px}.meter{font-size:14px;color:#c6ff92}input,select{width:100%;padding:12px;background:#241b2b;border:1px solid #816a89;color:#fff;border-radius:10px;font-size:16px}label{display:block;margin:10px 0 5px;color:#e1cce2;font-size:13px}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hidden{display:none!important}.history{padding:10px 0;border-bottom:1px solid #594561;font-size:14px}.history strong{color:#baff7c}.notice{border-left:3px solid #a8ff5c;padding:10px 12px;background:#3a2d43;color:#eadbea;border-radius:6px;font-size:13px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}footer{text-align:center;color:#9d8aa1;font-size:12px;margin-top:25px}dialog{background:#302339;color:#f8eaf5;border:1px solid #8a7190;border-radius:17px;max-width:min(94vw,480px);width:100%;padding:20px}dialog::backdrop{background:#110a17c9}dialog h2{margin-top:0}.dialogbuttons{display:flex;gap:8px;margin-top:15px}.dialogbuttons button{flex:1}@media(max-width:420px){.formrow{grid-template-columns:1fr}nav button{font-size:12px;padding:9px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card{padding:10px}.flask{width:98px;height:138px}.card h3{font-size:.94rem}.actions button{font-size:11px}}
</style></head><body><div class="wrap"><header><div class="eyebrow">✦ LE GRIMOIRE DES ÉCONOMIES ✦</div><h1>☽ Mes Petits Trésors ☾</h1><div class="muted">Chaque euro est une goutte de magie 🧪</div></header><nav><button data-tab="home" class="active">✦ Grimoire</button><button data-tab="savings">🧪 Potions</button><button data-tab="challenges">🌙 Sortilèges</button><button data-tab="history">📜 Archives</button></nav><main id="main"></main><footer>Ton laboratoire privé · données conservées sur cet appareil · pense à exporter une sauvegarde ♡</footer></div><dialog id="modal"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="dialogbuttons"><button onclick="document.getElementById('modal').close()">Annuler</button><button class="primary" id="modalOk">Valider</button></div></dialog><input type="file" id="importFile" accept="application/json" hidden><script>
const KEY='petits-tresors-v1';let state={items:[],moves:[]};try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Array.isArray(saved.items)&&Array.isArray(saved.moves))state=saved}catch(e){}let tab='home';const euro=n=>Number(n||0).toLocaleString('fr-FR',{style:'currency',currency:'EUR'});const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{localStorage.setItem(KEY,JSON.stringify(state));render()};const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);const sum=t=>state.items.filter(i=>!i.archived&&(!t||i.type===t)).reduce((a,i)=>a+i.balance,0);const formatDate=d=>new Date(d).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'});const fmtPct=i=>i.type==='challenge'?(i.balance>0?Math.min(88,18+Math.log1p(i.balance)*12):0):(i.target>0?Math.min(100,Math.max(0,i.balance/i.target*100)):0);
function flask(i){const p=fmtPct(i),top=191-p*1.42,uid='f'+i.id.replace(/[^a-z0-9]/gi,'');return `<svg class="flask" viewBox="0 0 150 205" role="img" aria-label="${i.type==='challenge'?'Fiole contenant '+euro(i.balance):'Fiole remplie à '+Math.round(p)+' %'}"><defs><clipPath id="${uid}c"><path d="M62 20H88V75L122 144Q142 187 102 191H48Q8 187 28 144L62 75Z"/></clipPath><linearGradient id="${uid}g" x1="0" y1="0" x2=".4" y2="1"><stop stop-color="#d7ff65"/><stop offset=".48" stop-color="#9bff32"/><stop offset="1" stop-color="#2eae42"/></linearGradient></defs><path d="M62 20H88V75L122 144Q142 187 102 191H48Q8 187 28 144L62 75Z" fill="#4d3956" stroke="#cbb5d2" stroke-width="3"/><g clip-path="url(#${uid}c)"><rect x="8" y="${top}" width="135" height="190" fill="url(#${uid}g)"/><path d="M8 ${top}Q40 ${top-5} 75 ${top}T143 ${top}" fill="none" stroke="#efffb1" stroke-width="3"/><circle cx="54" cy="163" r="4" fill="#e8ffa5" opacity=".8"/><circle cx="98" cy="140" r="3" fill="#e8ffa5" opacity=".7"/><circle cx="75" cy="177" r="2" fill="#e8ffa5"/></g><path d="M62 20H88V75L122 144Q142 187 102 191H48Q8 187 28 144L62 75Z" fill="none" stroke="#d4c0dc" stroke-width="3"/><rect x="57" y="13" width="36" height="14" rx="3" fill="#a58b78" stroke="#e0c3aa" stroke-width="2"/><path d="M67 35V72" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".28"/><path d="M19 70l4 7 7 3-7 3-4 7-3-7-7-3 7-3zM131 54l3 5 5 2-5 2-3 5-2-5-5-2 5-2z" fill="#b7ff66"/></svg>`}
function card(i){return `<article class="card">${flask(i)}<h3>${esc(i.name)}</h3><strong class="meter">${euro(i.balance)}</strong>${i.type==='challenge'?'<p>Montant collecté · sans objectif</p>':`<p>Objectif : ${euro(i.target)}</p><p>${Math.round(fmtPct(i))}% rempli ${fmtPct(i)>=100?'✨':''}</p>`}<div class="actions"><button onclick="moveDialog('${i.id}','deposit')">+ Ajouter</button><button onclick="moveDialog('${i.id}','withdraw')">− Retirer</button><button onclick="editDialog('${i.id}')">⚙ Modifier</button></div></article>`}
function section(type){const arr=state.items.filter(i=>i.type===type&&!i.archived);return `<div class="toolbar"><button class="primary" onclick="newDialog('${type}')">＋ ${type==='saving'?'Nouvelle épargne':'Nouveau défi'}</button>${type==='challenge'?'<button onclick="transferDialog()">↗ Transférer un défi</button>':''}</div>${type==='challenge'?'<p class="notice">Rythme : à chaque période. Quand un défi est terminé, transfère sa somme vers sa destination sans la compter deux fois.</p>':'<p class="notice">Rythme : un versement mensuel selon ton organisation. Tu peux aussi enregistrer un retrait.</p>'}${arr.length?`<div class="cards">${arr.map(card).join('')}</div>`:'<div class="panel"><p>Aucune fiole pour le moment. Crée ton premier trésor ! 🧪</p></div>'}`}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const main=document.getElementById('main');if(tab==='home'){main.innerHTML=`<section class="panel"><div class="muted">Trésor total dans tes fioles</div><div class="total">${euro(sum())}</div><small>Somme des soldes actuels, sans double comptage des transferts</small></section><div class="stats"><div class="panel"><div class="muted">🧪 Épargnes</div><div class="stat">${euro(sum('saving'))}</div></div><div class="panel"><div class="muted">🌙 Défis</div><div class="stat">${euro(sum('challenge'))}</div></div></div><section class="panel"><h2>☾ Ton laboratoire</h2><p>Une potion se remplit à chaque versement. Crée tes fioles : objectifs pour les épargnes, montants libres pour les défis à gratter et aux dés. Suis les euros réellement mis de côté.</p><div class="toolbar"><button onclick="switchTab('savings')">Voir mes épargnes</button><button onclick="switchTab('challenges')">Voir mes défis</button></div></section><section class="panel"><h2>✦ Sauvegarder mon grimoire</h2><p class="muted">Les données restent dans ce navigateur. Exporte régulièrement un fichier pour pouvoir les restaurer si tu changes de téléphone ou effaces ses données.</p><div class="toolbar"><button onclick="exportData()">↓ Exporter une sauvegarde</button><button onclick="document.getElementById('importFile').click()">↑ Restaurer une sauvegarde</button></div></section>`}else if(tab==='savings'){main.innerHTML=`<h2>🧪 Les Potions · Mes épargnes</h2>${section('saving')}`}else if(tab==='challenges'){main.innerHTML=`<h2>🌙 Les Sortilèges · Mes défis</h2>${section('challenge')}`}else{main.innerHTML=`<h2>📜 Les Archives</h2><p class="notice">Chaque ajout, retrait et transfert est conservé dans l'historique.</p><div class="panel">${state.moves.length?state.moves.slice().reverse().map(m=>`<div class="history"><strong>${esc(m.label)}</strong><br>${euro(m.amount)} · ${formatDate(m.date)}${m.note?' · '+esc(m.note):''}</div>`).join(''):'Aucun mouvement enregistré pour le moment.'}</div>`}}
function switchTab(t){tab=t;render();window.scrollTo(0,0)}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));function dialog(title,html,fn){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=html;document.getElementById('modalOk').onclick=fn;document.getElementById('modal').showModal()};function close(){document.getElementById('modal').close()};function number(v){const n=Number(String(v).replace(',','.'));return Number.isFinite(n)?Math.round(n*100)/100:NaN}
function newDialog(type){const saving=type==='saving';dialog('Créer une '+(saving?'épargne':'défi'),`<label>Nom de la fiole</label><input id="itemName" placeholder="Ex. Fonds d'urgence" maxlength="60">${saving?'<label>Objectif (€)</label><input id="itemTarget" type="number" min=".01" step=".01" placeholder="Ex. 500">':'<p class="muted">Aucun objectif à définir : idéal pour les pastilles à gratter et les jeux de dés. La potion réagit aux versements, sans pourcentage.</p><label>Destination prévue (facultatif)</label><input id="itemDest" placeholder="Ex. Noël, fonds voiture…" maxlength="60">'}`,()=>{const name=document.getElementById('itemName').value.trim(),target=saving?number(document.getElementById('itemTarget').value):null;if(!name||(saving&&!(target>0)))return alert(saving?'Indique un nom et un objectif supérieur à zéro.':'Indique un nom pour ton défi.');state.items.push({id:id(),name,type,target,balance:0,destination:saving?'':document.getElementById('itemDest').value.trim(),archived:false});close();save()})}
function editDialog(itemId){const i=state.items.find(x=>x.id===itemId),saving=i.type==='saving';dialog('Modifier la fiole',`<label>Nom</label><input id="itemName" value="${esc(i.name)}" maxlength="60">${saving?`<label>Objectif (€)</label><input id="itemTarget" type="number" min=".01" step=".01" value="${i.target||''}">`:`<p class="muted">Défi sans objectif fixe · montant final inconnu</p><label>Destination</label><input id="itemDest" value="${esc(i.destination||'')}" maxlength="60">`}<p><button id="archiveBtn" type="button">Archiver cette fiole</button></p>`,()=>{const name=document.getElementById('itemName').value.trim(),target=saving?number(document.getElementById('itemTarget').value):null;if(!name||(saving&&!(target>0)))return alert(saving?'Nom et objectif valides nécessaires.':'Indique un nom valide.');i.name=name;i.target=target;if(!saving)i.destination=document.getElementById('itemDest').value.trim();close();save()});document.getElementById('archiveBtn').onclick=()=>{if(i.balance!==0)return alert('Pour archiver, le solde doit être à zéro. Transfère ou retire les fonds d’abord.');if(confirm('Archiver cette fiole ? Son historique sera conservé.')){i.archived=true;close();save()}}}
function moveDialog(itemId,kind){const i=state.items.find(x=>x.id===itemId),deposit=kind==='deposit';dialog(deposit?'Ajouter une goutte de magie':'Retirer de la fiole',`<p>${esc(i.name)} · solde actuel ${euro(i.balance)}</p><label>Montant (€)</label><input id="moveAmount" type="number" min=".01" step=".01" placeholder="10"><label>Note (facultatif)</label><input id="moveNote" placeholder="${i.type==='saving'?'Versement mensuel':'Période 1, achat…'}" maxlength="100">`,()=>{const a=number(document.getElementById('moveAmount').value);if(!(a>0))return alert('Indique un montant positif.');if(!deposit&&a>i.balance)return alert('Le retrait dépasse le solde disponible.');i.balance=Math.round((i.balance+(deposit?a:-a))*100)/100;state.moves.push({id:id(),date:new Date().toISOString(),amount:a,label:(deposit?'Versement · ':'Retrait · ')+i.name,note:document.getElementById('moveNote').value.trim()});close();save()})}
function transferDialog(){const from=state.items.filter(i=>i.type==='challenge'&&!i.archived&&i.balance>0),to=state.items.filter(i=>i.type==='saving'&&!i.archived);if(!from.length||!to.length)return alert('Il faut un défi avec un solde positif et au moins une épargne pour effectuer un transfert.');dialog('Transférer sans compter deux fois',`<label>Défi d'origine</label><select id="from">${from.map(i=>`<option value="${i.id}">${esc(i.name)} · ${euro(i.balance)}</option>`).join('')}</select><label>Épargne de destination</label><select id="to">${to.map(i=>`<option value="${i.id}">${esc(i.name)}</option>`).join('')}</select><label>Montant (€)</label><input id="transferAmount" type="number" min=".01" step=".01"><p class="muted">Le montant est retiré du défi et ajouté à l'épargne : le total ne change pas.</p>`,()=>{const a=number(document.getElementById('transferAmount').value),f=state.items.find(i=>i.id===document.getElementById('from').value),t=state.items.find(i=>i.id===document.getElementById('to').value);if(!(a>0)||a>f.balance)return alert('Montant invalide ou supérieur au solde du défi.');f.balance=Math.round((f.balance-a)*100)/100;t.balance=Math.round((t.balance+a)*100)/100;state.moves.push({id:id(),date:new Date().toISOString(),amount:a,label:'Transfert · '+f.name+' → '+t.name,note:'Sans double comptage'});close();save()})}
function exportData(){const blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mes-petits-tresors-sauvegarde-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}document.getElementById('importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(!Array.isArray(obj.items)||!Array.isArray(obj.moves))throw Error();if(confirm('Restaurer cette sauvegarde ? Les données actuelles seront remplacées.')){state={items:obj.items,moves:obj.moves};save();alert('Sauvegarde restaurée !')}}catch(err){alert('Ce fichier ne semble pas être une sauvegarde valide.')}e.target.value=''};render();
if('serviceWorker' in navigator && location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
